<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0B1F4B" />

    <title>MH Menu – Menu digital par QR Code pour restaurants en Tunisie</title>
    <meta
      name="description"
      content="Créez le menu digital de votre restaurant, café ou snack et partagez-le par QR Code. Modifiez vos prix en un clic. Essai gratuit 3 jours, sans carte bancaire. 29 DT/mois."
    />
    <link rel="canonical" href="https://mhmenu.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MH Menu" />
    <meta property="og:title" content="MH Menu – Votre menu digital, accessible en un simple scan" />
    <meta
      property="og:description"
      content="Présentez vos plats, vos prix et vos promotions grâce à un menu digital accessible depuis un simple QR Code."
    />
    <meta property="og:url" content="https://mhmenu.com/" />
    <meta property="og:image" content="https://mhmenu.com/og-image.png" />
    <meta property="og:locale" content="fr_TN" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "MH Menu",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "publisher": { "@type": "Organization", "name": "MH Digital Solution", "url": "https://www.mh-digital-solution.com" },
        "offers": [
          { "@type": "Offer", "name": "Mensuel", "price": "29", "priceCurrency": "TND" },
          { "@type": "Offer", "name": "Annuel", "price": "290", "priceCurrency": "TND" }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
